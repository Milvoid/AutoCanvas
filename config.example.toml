root = "runtime"
host = "127.0.0.1"
port = 8080
# Empty means all active Canvas courses. Restrict to chosen course IDs if desired.
course_ids = []
auto_asr = true
auto_slides = true
auto_live = true
course_interval = 604800
sync_interval = 3600
assignment_interval = 1800
schedule_interval = 60
live_lead_seconds = 600
# Drop oldest queued audio and record a gap if inference cannot keep up.
live_queue_chunks = 100
model = "Qwen/Qwen3-ASR-0.6B"
device = "mps"
asr_backend = "torch"
# Apple Silicon low-memory option (install .[asr-mlx] and cache the model first):
# asr_backend = "mlx"
# model = "moona3k/mlx-qwen3-asr-0.6b-8bit"
# Preserve checkpoint precision; float32/float16/bfloat16 are explicit overrides.
asr_dtype = "auto"
# Unload the isolated model worker after this many seconds without a chunk.
asr_idle_seconds = 120
chunk_seconds = 3.0
sample_every = 5.0
keywords = ["签到", "点名", "名字"]
keyword_debounce = 30
